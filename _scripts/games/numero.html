<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Adivinhe o Número</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#1a1033;color:#fff;text-align:center;padding:16px}
h1{font-size:22px;margin:6px 0}p{color:#fcd34d;margin:8px 0}
input{font-size:26px;width:140px;text-align:center;border-radius:12px;border:2px solid #f59e0b;padding:8px;background:#0f0a1f;color:#fff}
button{background:#f59e0b;border:0;border-radius:12px;padding:12px 20px;font-weight:800;font-size:18px;cursor:pointer;margin:6px}
#hint{font-size:22px;min-height:34px;font-weight:800}
</style></head><body>
<h1>🔢 Adivinhe o Número</h1>
<p>Pensei em um número de <b>1 a 100</b>. Consegue descobrir?</p>
<input id="n" type="number" min="1" max="100" inputmode="numeric" placeholder="?">
<div><button onclick="guess()">Chutar</button><button onclick="reset()">Novo jogo</button></div>
<div id="hint"></div><p>Tentativas: <b id="tries">0</b></p>
<script>
var secret,tries;
function reset(){secret=1+Math.floor(Math.random()*100);tries=0;document.getElementById('tries').textContent=0;document.getElementById('hint').textContent='';document.getElementById('n').value='';document.getElementById('n').disabled=false}
function guess(){var el=document.getElementById('n'),v=parseInt(el.value,10),h=document.getElementById('hint');
 if(!(v>=1&&v<=100)){h.textContent='Digite um número de 1 a 100 🙂';return}
 tries++;document.getElementById('tries').textContent=tries;
 if(v===secret){h.textContent='🎉 Acertou em '+tries+' tentativa(s)!';el.disabled=true}
 else if(v<secret){h.textContent='⬆️ É maior!'}else{h.textContent='⬇️ É menor!'}
 el.select()}
document.getElementById('n').addEventListener('keydown',function(e){if(e.key==='Enter')guess()});
reset();
</script></body></html>
