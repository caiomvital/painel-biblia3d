<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jogo da Memória</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#1c1408;color:#fff;text-align:center;padding:12px}
h1{font-size:20px;margin:4px 0}p{margin:4px 0;color:#fcd34d}
#board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:420px;margin:12px auto}
.card{aspect-ratio:1;border-radius:14px;border:2px solid #b45309;background:#78350f;font-size:min(11vw,48px);display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;transition:transform .2s}
.card.open{background:#fef3c7;transform:rotateY(0)}.card.done{background:#fde68a;border-color:#fbbf24;opacity:.85}
button{background:#f59e0b;border:0;border-radius:12px;padding:10px 18px;font-weight:800;font-size:16px;cursor:pointer;margin-top:6px}
</style></head><body>
<h1>🧠 Jogo da Memória</h1>
<p>Encontre os pares! Jogadas: <b id="moves">0</b> · Pares: <b id="pairs">0</b>/8</p>
<div id="board"></div>
<div id="win" hidden><p style="font-size:20px">🎉 Parabéns! Você terminou em <b id="final"></b> jogadas!</p></div>
<button onclick="start()">Jogar de novo</button>
<script>
var EMO=['🕊️','🦁','🐟','⭐','🌈','🐑','🍎','🐫'];var first=null,lock=false,moves=0,pairs=0;
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function start(){var b=document.getElementById('board');b.innerHTML='';moves=0;pairs=0;first=null;lock=false;
 document.getElementById('moves').textContent=0;document.getElementById('pairs').textContent=0;document.getElementById('win').hidden=true;
 shuffle(EMO.concat(EMO)).forEach(function(e){var c=document.createElement('div');c.className='card';c.dataset.e=e;c.textContent='❓';c.onclick=function(){flip(c)};b.appendChild(c)})}
function flip(c){if(lock||c===first||c.classList.contains('done'))return;c.classList.add('open');c.textContent=c.dataset.e;
 if(!first){first=c;return}
 moves++;document.getElementById('moves').textContent=moves;
 if(first.dataset.e===c.dataset.e){first.classList.add('done');c.classList.add('done');first=null;pairs++;document.getElementById('pairs').textContent=pairs;
  if(pairs===8){document.getElementById('final').textContent=moves;document.getElementById('win').hidden=false}}
 else{lock=true;var a=first;first=null;setTimeout(function(){a.classList.remove('open');a.textContent='❓';c.classList.remove('open');c.textContent='❓';lock=false},700)}}
start();
</script></body></html>
