<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pega a Estrela</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#0b1026;color:#fff;text-align:center;padding:10px;touch-action:manipulation}
h1{font-size:20px;margin:4px 0}.hud{display:flex;justify-content:space-around;color:#fcd34d;font-weight:700;margin:4px 0}
#area{position:relative;width:100%;max-width:480px;height:min(60vh,420px);margin:8px auto;border:2px solid #f59e0b;border-radius:16px;background:radial-gradient(circle at 30% 20%,#1e2a5a,#0b1026);overflow:hidden}
#star{position:absolute;font-size:44px;cursor:pointer;user-select:none;transition:left .15s,top .15s;line-height:1}
button{background:#f59e0b;border:0;border-radius:12px;padding:10px 18px;font-weight:800;font-size:16px;cursor:pointer}
</style></head><body>
<h1>⭐ Pega a Estrela!</h1>
<div class="hud"><span>Pontos: <b id="score">0</b></span><span>Tempo: <b id="time">20</b>s</span><span>Recorde: <b id="best">0</b></span></div>
<div id="area"><div id="star" hidden>⭐</div></div>
<p id="msg">Toque na estrela o mais rápido que puder!</p>
<button id="go" onclick="start()">Começar</button>
<script>
var score=0,t=20,timer=null,best=0,star=document.getElementById('star'),area=document.getElementById('area');
function move(){var w=area.clientWidth-50,h=area.clientHeight-50;star.style.left=Math.random()*w+'px';star.style.top=Math.random()*h+'px'}
star.onclick=function(){if(!timer)return;score++;document.getElementById('score').textContent=score;move()};
star.ontouchstart=function(e){e.preventDefault();star.onclick()};
function start(){score=0;t=20;document.getElementById('score').textContent=0;document.getElementById('time').textContent=t;
 document.getElementById('msg').textContent='Vai! Vai! Vai!';star.hidden=false;document.getElementById('go').disabled=true;move();clearInterval(timer);
 timer=setInterval(function(){t--;document.getElementById('time').textContent=t;
  if(t%2===0&&t>0)move();
  if(t<=0){clearInterval(timer);timer=null;star.hidden=true;document.getElementById('go').disabled=false;document.getElementById('go').textContent='Jogar de novo';
   if(score>best){best=score;document.getElementById('best').textContent=best}
   document.getElementById('msg').textContent='🎉 Acabou! Você pegou '+score+' estrelas!'}},1000)}
</script></body></html>
